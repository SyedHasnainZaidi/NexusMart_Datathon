# Reproducible environment: PostgreSQL (Airflow metadata + NexusMart warehouse)
# and Airflow 2.10 (LocalExecutor: webserver + scheduler).
#   cp .env.example .env      # then edit passwords
#   docker compose up -d --build
#   open http://localhost:8080 -> trigger DAG "nexusmart_etl"
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    # warehouse connection used by the DAG (Airflow Connection id: nexusmart_dw)
    AIRFLOW_CONN_NEXUSMART_DW: postgresql://${NEXUSMART_DB_USER}:${NEXUSMART_DB_PASSWORD}@postgres:5432/${NEXUSMART_DB_NAME}
    AIRFLOW_VAR_NEXUSMART_RAW_DIR: /opt/nexusmart/data/raw
    AIRFLOW_VAR_NEXUSMART_WORK_DIR: /opt/nexusmart/data
    AIRFLOW_VAR_NEXUSMART_LOAD_MODE: full
    NEXUSMART_HOME: /opt/nexusmart
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./nexusmart_etl:/opt/nexusmart/nexusmart_etl
    - ./sql:/opt/nexusmart/sql
    - ./data:/opt/nexusmart/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "${WAREHOUSE_HOST_PORT:-5433}:5432"     # Power BI -> localhost:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
